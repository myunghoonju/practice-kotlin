name: deploy-practice-kotlin

on:
  push:
    branches:
      - main

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: load file from github
        uses: actions/checkout@v4

      - name: install java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: create yml
        run: echo "${{ secrets.APPLICATION_PROPERTIES }}" > src/main/resources/application.yml

      - name: test & build
        run: ./gradlew clean build

      - name: rename jar
        run: mv ./build/libs/*SNAPSHOT.jar  ./project.jar

      - name: send jar to ec2 via scp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: project.jar
          target: /home/ubuntu/practice-kotlin/tobe

      - name: connect to ec2 via ssh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            rm -rf /home/ubuntu/practice-kotlin/current
            mkdir /home/ubuntu/practice-kotlin/current
            mv /home/ubuntu/practice-kotlin/tobe/project.jar /home/ubuntu/practice-kotlin/current/project.jar
            cd /home/ubuntu/practice-kotlin/current
            sudo fuser -k -n tcp 8080 || true
            nohup java -jar project.jar > ./output.log 2>&1 &
            rm -rf /home/ubuntu/practice-kotlin/tobe



